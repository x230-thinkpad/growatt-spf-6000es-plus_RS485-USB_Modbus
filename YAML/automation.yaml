- id: growatt_batt_to_grid_2way_sync
  alias: Growatt Battery To Grid 2-Way Sync
  mode: restart
  trigger:
  - platform: state
    entity_id:
    - input_number.growatt_batt_to_grid
    - sensor.growatt_battery_to_grid
  action:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''input_number.growatt_batt_to_grid''
          }}

          '
      sequence:
      - service: modbus.write_register
        data:
          hub: Growatt_spf_6000es_plus
          slave: 1
          address: 37
          value: '{{ (states(''input_number.growatt_batt_to_grid'')|float * 10) |
            int }}

            '
      - delay: 00:00:02
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id.startswith(''sensor.'') }}

          '
      sequence:
      - service: input_number.set_value
        target:
          entity_id: input_number.growatt_batt_to_grid
        data:
          value: '{{ states(trigger.entity_id)|float }}

            '
