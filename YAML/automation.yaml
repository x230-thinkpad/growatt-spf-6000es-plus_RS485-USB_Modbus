- id: growatt_ac_output_2way_sync
  alias: Growatt AC Output Source 2-Way Sync
  mode: restart
  trigger:
  - platform: state
    entity_id: input_select.growatt_ac_source
    id: from_input
  - platform: state
    entity_id: sensor.growatt_ac_output_source_read
    id: from_sensor
  variables:
    map_to_register:
      SBU priority: 0
      Solar first: 1
      Utility first: 2
      SUB priority: 3
    map_to_text:
      0: SBU priority
      1: Solar first
      2: Utility first
      3: SUB priority
  action:
  - choose:
    - conditions:
      - condition: trigger
        id: from_input
      - condition: template
        value_template: "{{ map_to_register[states('input_select.growatt_ac_source')]\n
          \  != states('sensor.growatt_ac_output_source_read')|int }}\n"
      sequence:
      - service: modbus.write_register
        data:
          hub: Growatt_spf_6000es_plus
          slave: 1
          address: 1
          value: '{{ map_to_register[states(''input_select.growatt_ac_source'')] }}

            '
    - conditions:
      - condition: trigger
        id: from_sensor
      - condition: template
        value_template: "{{ map_to_text[states('sensor.growatt_ac_output_source_read')|int]\n
          \  != states('input_select.growatt_ac_source') }}\n"
      sequence:
      - service: input_select.select_option
        target:
          entity_id: input_select.growatt_ac_source
        data:
          option: '{{ map_to_text[states(''sensor.growatt_ac_output_source_read'')|int]
            }}

            '
