- id: growatt_battery_cutoff_2way_sync
  alias: Growatt Battery Cutoff 2-Way Sync
  triggers:
  - entity_id: input_number.growatt_batt_cutoff
    id: from_input
    trigger: state
  - entity_id: sensor.growatt_battery_cutoff
    id: from_sensor
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: from_input
      sequence:
      - variables:
          safe_value: "{% set v = states('input_number.growatt_batt_cutoff')|float
            %} {% if v < 42 %}\n  42\n{% elif v > 46 %}\n  46\n{% else %}\n  {{ v
            }}\n{% endif %}\n"
      - condition: template
        value_template: "{{ safe_value|float !=\n   states('sensor.growatt_battery_cutoff')|float
          }}\n"
      - data:
          hub: Growatt_spf_6000es_plus
          slave: 1
          address: 82
          value: '{{ (safe_value|float * 10) | int }}

            '
        action: modbus.write_register
      - target:
          entity_id: input_number.growatt_batt_cutoff
        data:
          value: '{{ safe_value|float }}'
        action: input_number.set_value
    - conditions:
      - condition: trigger
        id: from_sensor
      sequence:
      - variables:
          safe_value: "{% set v = states('sensor.growatt_battery_cutoff')|float %}
            {% if v < 42 %}\n  42\n{% elif v > 46 %}\n  46\n{% else %}\n  {{ v }}\n{%
            endif %}\n"
      - target:
          entity_id: input_number.growatt_batt_cutoff
        data:
          value: '{{ safe_value|float }}'
        action: input_number.set_value
  mode: restart
