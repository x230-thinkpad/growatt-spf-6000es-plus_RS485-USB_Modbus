template:

#   GROWATT SETTINGS
# ==============================================================================
  - sensor:
      - name: Growatt AC Output Source
        unique_id: growatt_ac_output_source
        state: >
          {% set code = states('sensor.growatt_ac_output_source_read') | int(-1) %}
          {% if code == -1 %}
            Unavailable
          {% else %}
            {% set map = {0:'BAT First', 1:'PV First', 2:'UTI First', 3:'PV&UTI First'} %}
            {{ map.get(code, 'Unknown (' ~ code ~ ')') }}
          {% endif %}

      - name: Growatt Charge Source
        unique_id: growatt_charge_source
        state: >
          {% set code = states('sensor.growatt_charge_source_read') | int(-1) %}
          {% if code == -1 %}
            Unavailable
          {% else %}
            {% set map = {0:'PV first', 1:'PV&UTI', 2:'PV Only'} %}
            {{ map.get(code, 'Unknown (' ~ code ~ ')') }}
          {% endif %}

      - name: Growatt Battery Type
        unique_id: growatt_battery_type
        state: >
          {% set code = states('sensor.growatt_battery_type_read') | int(-1) %}
          {% if code == -1 %}
            Unavailable
          {% else %}
            {% set map = {0:'AGM', 1:'FLD', 2:'USE', 3:'Lithium', 4:'USE2'} %}
            {{ map.get(code, 'Unknown (' ~ code ~ ')') }}
          {% endif %}

      - name: "Growatt Status Text"
        unique_id: growatt_status_text
        state: >
          {% set code = states('sensor.growatt_status') | int(-1) %}
          {% if code == -1 %}
            Unavailable
          {% else %}
            {% set map = {
              0: 'Standby',
              1: 'PV & Grid Supporting Loads',
              2: 'Battery Discharging',
              3: 'Fault',
              4: 'Flash',
              5: 'PV Charging',
              6: 'Grid Charging',
              7: 'PV & Grid Charging',
              8: 'PV & Grid Charging + Grid Bypass',
              9: 'PV Charging + Grid Bypass',
              10: 'Grid Charging + Grid Bypass',
              11: 'Grid Bypass',
              12: 'PV Charging + Loads Supporting',
              13: 'PV Discharging',
              14: 'PV & Battery Discharging',
              15: 'Generator Charging',
              16: 'Generator Charging + Gen Bypass',
              17: 'PV & Generator Charging',
              18: 'PV & Generator Charging + Gen Bypass',
              19: 'PV Charging + Gen Bypass',
              20: 'Gen Bypass',
              21: 'PV Export to Grid',
              22: 'PV Export to Grid + Loads Supporting',
              23: 'PV Charging + Export to Grid',
              24: 'PV Charging + Export to Grid + Loads Supporting',
              25: 'Battery Export to Grid',
              26: 'Battery Export to Grid + Loads Supporting',
              27: 'Battery & PV Export to Grid',
              28: 'Battery & PV Export to Grid + Loads Supporting'
            } %}
            {{ map.get(code, 'Unknown (' ~ code ~ ')') }}
          {% endif %}

      - name: Growatt Fault Info
        unique_id: growatt_fault_info
        state: >
          {% set f = states('sensor.growatt_fault_code') | int(0) %}
          {% if f == 0 %}
            Normal
          {% else %}
            {% set ns = namespace(items=[]) %}
            {# Pemetaan Fault Berdasarkan Tabel Register 4.2 #}
            {% if (f | bitwise_and(1)) > 0 %}{% set ns.items = ns.items + ['Fan lock'] %}{% endif %}
            {% if (f | bitwise_and(2)) > 0 %}{% set ns.items = ns.items + ['Over Temperature'] %}{% endif %}
            {% if (f | bitwise_and(4)) > 0 %}{% set ns.items = ns.items + ['Bat Voltage High'] %}{% endif %}
            {% if (f | bitwise_and(8)) > 0 %}{% set ns.items = ns.items + ['Battery low'] %}{% endif %}
            {% if (f | bitwise_and(16)) > 0 %}{% set ns.items = ns.items + ['Output short'] %}{% endif %}
            {% if (f | bitwise_and(32)) > 0 %}{% set ns.items = ns.items + ['Output voltage high'] %}{% endif %}
            {% if (f | bitwise_and(64)) > 0 %}{% set ns.items = ns.items + ['Over Load'] %}{% endif %}
            {% if (f | bitwise_and(128)) > 0 %}{% set ns.items = ns.items + ['Bus voltage high'] %}{% endif %}
            {% if (f | bitwise_and(256)) > 0 %}{% set ns.items = ns.items + ['Bus start fail'] %}{% endif %}
            {{ ns.items | join(', ') if ns.items | count > 0 else 'Unknown Fault (' ~ f ~ ')' }}
          {% endif %}

      - name: Growatt Warning Info
        unique_id: growatt_warning_info
        state: >
          {% set wl = states('sensor.growatt_warning_code_l') | int(0) %}
          {% set wh = states('sensor.growatt_warning_code_h') | int(0) %}
          {% if wl == 0 and wh == 0 %}
            Normal
          {% else %}
            {% set ns = namespace(items=[]) %}
            {# WARNING LOW (Register 41) #}
            {% if (wl | bitwise_and(1)) > 0 %}{% set ns.items = ns.items + ['Fan lock warning'] %}{% endif %}
            {% if (wl | bitwise_and(2)) > 0 %}{% set ns.items = ns.items + ['Over charge'] %}{% endif %}
            {% if (wl | bitwise_and(4)) > 0 %}{% set ns.items = ns.items + ['Battery voltage low'] %}{% endif %}
            {% if (wl | bitwise_and(8)) > 0 %}{% set ns.items = ns.items + ['Over load'] %}{% endif %}
            {% if (wl | bitwise_and(16)) > 0 %}{% set ns.items = ns.items + ['Op power derating'] %}{% endif %}
            {% if (wl | bitwise_and(32)) > 0 %}{% set ns.items = ns.items + ['Solar stop due to bat low'] %}{% endif %}
            {% if (wl | bitwise_and(64)) > 0 %}{% set ns.items = ns.items + ['Solar stop due to Pv high'] %}{% endif %}
            {% if (wl | bitwise_and(128)) > 0 %}{% set ns.items = ns.items + ['solar stop due to over load'] %}{% endif %}
            {% if (wl | bitwise_and(256)) > 0 %}{% set ns.items = ns.items + ['Grid different'] %}{% endif %}
            {% if (wl | bitwise_and(512)) > 0 %}{% set ns.items = ns.items + ['Grid phase error'] %}{% endif %}
            {% if (wl | bitwise_and(1024)) > 0 %}{% set ns.items = ns.items + ['Op phase loss'] %}{% endif %}
            {% if (wl | bitwise_and(2048)) > 0 %}{% set ns.items = ns.items + ['Over temperature'] %}{% endif %}
            {% if (wl | bitwise_and(4096)) > 0 %}{% set ns.items = ns.items + ['Buck current over'] %}{% endif %}
            {% if (wl | bitwise_and(8192)) > 0 %}{% set ns.items = ns.items + ['Battery disconnected'] %}{% endif %}
            {% if (wl | bitwise_and(16384)) > 0 %}{% set ns.items = ns.items + ['BMS com error'] %}{% endif %}
            {% if (wl | bitwise_and(32768)) > 0 %}{% set ns.items = ns.items + ['Pv power insufficient'] %}{% endif %}

            {# WARNING HIGH (Register 42) #}
            {% if (wh | bitwise_and(1)) > 0 %}{% set ns.items = ns.items + ['No bat parallel disable'] %}{% endif %}
            {% if (wh | bitwise_and(2)) > 0 %}{% set ns.items = ns.items + ['Parallel version different'] %}{% endif %}
            {% if (wh | bitwise_and(8)) > 0 %}{% set ns.items = ns.items + ['Capacity different'] %}{% endif %}
            {% if (wh | bitwise_and(16)) > 0 %}{% set ns.items = ns.items + ['Host Loss'] %}{% endif %}
            {% if (wh | bitwise_and(32)) > 0 %}{% set ns.items = ns.items + ['BmsCellOverVolt'] %}{% endif %}
            {% if (wh | bitwise_and(64)) > 0 %}{% set ns.items = ns.items + ['Bms TotalOverVolt'] %}{% endif %}
            {% if (wh | bitwise_and(128)) > 0 %}{% set ns.items = ns.items + ['BmsDischgOverCurr'] %}{% endif %}
            {% if (wh | bitwise_and(256)) > 0 %}{% set ns.items = ns.items + ['BmsChgOverCurr'] %}{% endif %}
            {% if (wh | bitwise_and(512)) > 0 %}{% set ns.items = ns.items + ['BmsOverTemp'] %}{% endif %}
            {% if (wh | bitwise_and(1024)) > 0 %}{% set ns.items = ns.items + ['Battery voltage consistent'] %}{% endif %}

            {{ ns.items | join(', ') if ns.items | count > 0 else 'Unknown Warning' }}
          {% endif %}